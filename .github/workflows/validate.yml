name: Validate

# Keep this on pull_request, not pull_request_target: this workflow runs code
# from the pull request, so it must never receive secrets or a write token.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm test
      - run: npm run validate
      - run: npm run build:catalog
      - name: Check changed manifests and downloads
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: node scripts/verify-changes.mjs "$BASE_SHA"
