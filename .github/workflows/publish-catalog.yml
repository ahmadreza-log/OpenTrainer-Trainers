name: Publish catalog

on:
  push:
    branches: [main]
    paths:
      - games/**
      - manifests/**
      - schemas/**
      - scripts/**
  workflow_dispatch:

permissions:
  contents: read

# Never let an older run overwrite a newer catalog, which could undo a revocation.
concurrency:
  group: publish-catalog
  cancel-in-progress: false

jobs:
  # Installs and runs code with a read-only token. Only the publish job can write.
  build:
    # workflow_dispatch can target any branch, but only main is reviewed.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run validate
      - run: npm run build:catalog
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: catalog
          path: dist/catalog.v1.json
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: catalog
      - name: Upload catalog
        run: |
          gh release view catalog >/dev/null 2>&1 || gh release create catalog --title "Catalog" --notes "Generated catalog. Don't edit by hand." --latest=false
          gh release upload catalog catalog.v1.json --clobber
